[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "object-document-store"
version = "0.1.0"
description = "PostgreSQL + MinIO object and document management MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg2-binary>=2.9,<3",
  "minio>=7.2,<8",
  "pydantic-settings>=2.0,<3",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "pg: requires PostgreSQL via TEST_DATABASE_URL (SKIP LOCKED semantics)",
]

[tool.setuptools.packages.find]
include = ["app*"]
