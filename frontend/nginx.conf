# 中文注释：前端静态资源 + /api 同源代理，浏览器与后端同域，规避 CORS。
# 默认 HTTP 模板；TLS_ENABLED=true 时由 40-configure-tls.sh 换装 nginx.tls*.conf。
server {
  listen 18000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 中文注释：基础安全响应头；CSP 禁止内联脚本与外域资源，配合后端 MIME 嗅探防存储型 XSS
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: __MINIO_CSP_ORIGIN__; font-src 'self' data:; connect-src 'self' __MINIO_CSP_ORIGIN__; frame-src __MINIO_CSP_ORIGIN__; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # SPA 路由回退
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API 代理到 FastAPI 服务
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 1g;
  }

  location /health {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
